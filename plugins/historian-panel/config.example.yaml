# HistorianPanel local configuration
#
# You do not need to edit this by hand: panel-setup (and the first review)
# creates `historian-panel.config.yaml` automatically, detecting what you have.
# See skills/panel-setup/references/auto-config.md. Every resource is optional;
# missing ones fall back to public sources. Relative paths resolve against the
# folder that holds the config. The real config is ignored by git: it may
# point at internal systems, and this repository is public.

# Where run output goes. The coordinator writes ledger.jsonl (one verdict per
# line) and report.md here. Point this at a clone of the private ledger repo
# when you have one.
ledger_dir: ./historian-panel-ledger

# The Library's verified-quotes list (spreadsheet or JSON export). Only the
# verified tiers count. Leave blank if you do not have access; the quote
# specialist then works from primary texts only.
verified_quotes_path: ""
verified_quote_tiers:
  - "Verified — Precise Citation"
  - "Likely Verified — Has Title & Date"

# Licensed or internal corpora the specialists may search. List the MCP tool or
# server names exactly as they appear in your session. Text from these corpora
# is for internal verification only: cite it, never copy it into public files.
corpora:
  books_mcp: ""        # e.g. the book-corpus search server
  archive_mcp: ""      # e.g. the archive transcript search server

# The TRA Chronological Record source scans, for sp-tra and sp-on-this-day.
tra_chronology_path: ""

# The Library's quote archive export (Theodore Roosevelt Center records), for
# sp-quote-finder.
quote_archive_path: ""

# Index of the book corpus by author: title, year, genre, and which
# specialists' subjects each book covers most. Built locally from the corpus
# (trpl-rag/hp_author_index/build.py). Used by sp-biographies,
# sp-scholarly-perspectives and scholarly-debate to pick whose work to read.
author_index_path: ""

# Pages a claim gets checked against before anything else.
check_first:
  misquotes: https://www.trlibrary.com/tr/quotes/misquotes
  fake_quotes: https://www.trlibrary.com/tr/fake-quotes

# Pass B coverage. 1.0 means every claim gets a blind second check.
pass_b_rate: 1.0

# Resources this person has said they don't have, so the panel never asks
# again. Keys from above, e.g. [verified_quotes_path, corpora.books_mcp].
not_available: []
