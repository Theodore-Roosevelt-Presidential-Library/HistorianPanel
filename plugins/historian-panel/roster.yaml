# HistorianPanel roster
#
# Every skill in skills/ must appear here, and every entry marked "active"
# must have a skill folder. "planned" entries have no folder yet; they are
# the backlog that propose-skill works from.
#
# routes.types     claim types (see schemas/claim.schema.json) the specialist takes
# routes.keywords  lowercase words or phrases; the coordinator routes a claim to a
#                  specialist when the claim text matches any of them
# A claim can go to at most three specialists in Pass A.

version: 1

groups:
  workflow: Workflow roles that run the review itself
  period: Periods of T.R.'s life
  family: Family and circle
  theme: Themes across his life
  collection: Primary collections and where they live
  scholarship: Biographies, historiography and quotes
  era: Context of the times
  media: Images, film, maps and objects

specialists:

  # ---------- Workflow ----------
  - name: accuracy-review
    group: workflow
    status: active
    title: Coordinator (ask, review, check, sweep)
  - name: claim-extractor
    group: workflow
    status: active
    title: Breaks copy into atomic, checkable claims
  - name: blind-reverify
    group: workflow
    status: active
    title: Pass B, rechecks a claim from scratch without seeing Pass A
  - name: source-independence
    group: workflow
    status: active
    title: Checks whether two sources are really one
  - name: error-sweep
    group: workflow
    status: active
    title: Finds every other place a confirmed error appears
  - name: propose-skill
    group: workflow
    status: active
    title: Drafts a new or improved skill as a pull request
  - name: panel-setup
    group: workflow
    status: active
    title: Install, update and health-check the panel
  - name: style-check
    group: workflow
    status: planned
    title: House style and Story Guide terminology

  # ---------- Phase 1 specialists (active) ----------
  - name: sp-family-offices
    group: family
    status: active
    title: Offices, ranks, careers and life events of T.R.'s family
    routes:
      types: [office, life_event, date, name, number]
      keywords: [ted jr, kermit, archie, archibald, quentin, ethel, alice, edith, bamie, corinne, elliott, mittie, theodore sr, son, daughter, sister, brother, wife, married, general, colonel, governor, congress, ambassador, minister, promoted]
  - name: sp-officeholder-sequences
    group: theme
    status: active
    title: Who held an office, in what order, and for how long
    routes:
      types: [sequence, office, date]
      keywords: [before him, after him, succeeded, preceded, predecessor, successor, secretary of, cabinet, term, tenure, elected, election, electoral, inaugurated, resigned, appointed]
  - name: sp-photo-id
    group: media
    status: active
    title: Who, when and where in images; captions, alt text and credits
    routes:
      types: [image_id]
      keywords: [photo, photograph, portrait, pictured, caption, alt text, image, painting, engraving, print, credit]
  - name: sp-generations
    group: family
    status: active
    title: Lineage, generations and cousin degrees
    routes:
      types: [name, life_event]
      keywords: [grandson, granddaughter, great-grandson, great-great, descendant, cousin, removed, generation, lineage, ancestor, family tree]
  - name: sp-superlatives
    group: theme
    status: active
    title: Firsts, onlys, records and "never" claims
    routes:
      types: [superlative]
      keywords: [first, only, youngest, oldest, largest, most, more than any, record, never, unprecedented, coined, invented, last]
  - name: sp-quote-verifier
    group: scholarship
    status: active
    title: Exact wording, source, date and venue of quotations
    routes:
      types: [quote]
      keywords: [said, wrote, quote, speech, address, letter, remarked, declared, "\""]
  - name: sp-badlands
    group: period
    status: active
    title: T.R. in Dakota Territory, 1883-1887, and later Badlands visits
    routes:
      types: [date, place, life_event, anecdote, name]
      keywords: [badlands, bad lands, dakota, medora, little missouri, maltese cross, elkhorn, dickinson, mingusville, de mores, sewall, dow, merrifield, ferris, stockmen, ranch, cattle]
  - name: sp-conservation
    group: theme
    status: active
    title: Public lands, forests, monuments, refuges and their numbers
    routes:
      types: [number, superlative, date, office]
      keywords: [acres, national forest, national monument, antiquities act, bird reservation, refuge, game preserve, national park, reclamation, conservation, forest service, pinchot, pelican island]

