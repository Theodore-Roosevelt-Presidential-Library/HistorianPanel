# HistorianPanel roster
#
# Every skill in skills/ must appear here, and every entry marked "active"
# must have a skill folder. "planned" entries are the backlog for propose-skill.
#
# title    short name shown in ROSTER.md
# blurb    plain-language "ask them about" line for ROSTER.md
# routes.types     claim types (schemas/claim.schema.json) the specialist takes
# routes.keywords  lowercase words or phrases that signal the specialist
#
# After editing, run: python scripts/build_roster_md.py

version: 2
groups:
  workflow: Workflow roles that run the review itself
  period: Periods of T.R.'s life
  family: Family and circle
  theme: Themes across his life
  collection: Primary collections and where they live
  scholarship: Biographies, historiography and quotes
  era: Context of the times
  media: Images, film, maps and objects
specialists:
- name: accuracy-review
  group: workflow
  status: active
  title: Coordinator
  blurb: Run a full check on a draft, a page or one question. Sends each claim to the right specialists and gives
    you keep, fix, hedge or cut.
- name: claim-extractor
  group: workflow
  status: active
  title: Claim extractor
  blurb: Breaks a page into every date, name, quote, number and photo ID a reader could check.
- name: blind-reverify
  group: workflow
  status: active
  title: Blind re-verifier
  blurb: Checks each claim again from scratch without seeing the first answer, so one mistake can't confirm itself.
- name: source-independence
  group: workflow
  status: active
  title: Source auditor
  blurb: Spots when two "sources" are really one site copying another, or something that doesn't count at all.
- name: error-sweep
  group: workflow
  status: active
  title: Error sweeper
  blurb: 'Once an error is confirmed, finds every other place it appears: pages, captions, datasets, social posts.'
- name: propose-skill
  group: workflow
  status: active
  title: Skill builder
  blurb: Drafts a new specialist or improves an existing one, as a pull request a person reviews.
- name: panel-setup
  group: workflow
  status: active
  title: Setup and updates
  blurb: Installs the panel, updates it, and runs a quick health check.
- name: style-check
  group: workflow
  status: active
  title: House style checker
  blurb: Kettle Hill not San Juan Hill, buttes not mesas, T.R. not Teddy, participants, Trustees, Benefactors.
- name: review-lenses
  group: workflow
  status: active
  title: Scholarly lenses
  blurb: Reads a piece the way a biographer, documentary editor, political, critical, regional, military or natural
    historian would, to catch omissions and framing a fact-check misses.
- name: scholar-review-packet
  group: workflow
  status: active
  title: Scholar review packet
  blurb: Prepares a 20-minute packet so a real historian can review a high-stakes piece and make the calls that
    need a person.
- name: scholarly-debate
  group: workflow
  status: active
  title: Scholarly debate
  blurb: Puts the documented positions of different eras of scholarship in a cited debate, then maps where they
    really disagree and suggests even-handed framing.
